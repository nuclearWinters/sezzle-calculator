services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: calculator
      MYSQL_USER: calculator
      MYSQL_PASSWORD: calculator
      MYSQL_ROOT_PASSWORD: calculator
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucalculator", "-pcalculator"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ALLOWED_ORIGIN: "http://localhost:3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: calculator
      DB_PASSWORD: calculator
      DB_NAME: calculator
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8080"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
